name: upstream-update

on:
  schedule:
    # 2 日に 1 回。cron の日付指定 (*/2) は月末で間隔が崩れるため、毎日動かして gate で半分に振り分ける。
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: upstream-update
  cancel-in-progress: false

jobs:
  # 2 日に 1 回に絞る。UTC の通算日が偶数の日だけ実行する (手動実行は常に実行)。
  gate:
    if: github.repository == 'hkrhd/Meltype' && github.ref == 'refs/heads/fork_by_hkrhd'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.day.outputs.run }}
    steps:
      - name: 実行日か判定
        id: day
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != 'schedule' ]] || (( $(date -u +%s) / 86400 % 2 == 0 )); then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo '今日は実行しない日です。'
          fi

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    environment: upstream-sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 同期用の SSH キーを確認
        env:
          SYNC_SSH_KEY: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}
        run: |
          if [[ -z "$SYNC_SSH_KEY" ]]; then
            echo '::error::upstream-sync Environment に書き込み用 deploy key の UPSTREAM_SYNC_SSH_KEY を設定してください。'
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}
          path: upstream-sync

      - name: upstream の main を追従
        working-directory: upstream-sync
        run: |
          set -euo pipefail

          # upstream のコードは実行せず、取得したコミットを main に転送する。
          git fetch --no-tags https://github.com/yksr-melt/Meltype.git refs/heads/main:refs/remotes/upstream/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/upstream/main; then
            echo '::error::main が upstream/main から分岐しています。確認してください。'
            exit 1
          fi
          # force は使わず、他の更新と競合した場合も上書きしない。
          git push git@github.com:hkrhd/Meltype.git refs/remotes/upstream/main:refs/heads/main

      - name: 取り込み依頼の PR を作成
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          main_sha=$(gh api "repos/$REPO/commits/main" --jq .sha)
          fork_sha=$(gh api "repos/$REPO/commits/fork_by_hkrhd" --jq .sha)
          ahead=$(gh api "repos/$REPO/compare/$fork_sha...$main_sha" --jq .ahead_by)
          if [[ "$ahead" == 0 ]]; then
            echo '未取り込みの更新はありません。'
            exit 0
          fi

          existing=$(gh pr list --repo "$REPO" --base fork_by_hkrhd --head main --state open --json url --jq '.[0].url // empty')
          if [[ -n "$existing" ]]; then
            echo "取り込み依頼の PR は作成済みです: $existing"
            exit 0
          fi

          {
            echo 'upstream の更新を、フォーク独自の挙動・方針を保って取り込んでください。'
            echo
            echo "- 通知時点の main（upstream/main）: \`$main_sha\`（未取り込み $ahead コミット）"
            echo "- 通知時点の fork_by_hkrhd: \`$fork_sha\`"
            echo "- [通知時点の upstream 差分](https://github.com/$REPO/compare/$fork_sha...$main_sha)"
            cat <<'BODY'

          作業開始時に最新の main を取得し、既存の作業中の変更を保持して `jj new fork_by_hkrhd main` で統合してください。
          競合がない箇所も意味上の衝突を確認し、AGENTS.md・README.md・docs/FORK.md に沿って調整してください。
          `bash mac/update.sh` でテスト・ビルド・実機への適用を行い、両ブランチを親に持つマージコミットを push して、変更点と検証結果をこの PR に記録してください。

          - [x] AI を使った（使った部分: この取り込み依頼文の作成）
          BODY
          } > "$RUNNER_TEMP/upstream-pr.md"

          gh pr create --repo "$REPO" --base fork_by_hkrhd --head main --draft \
            --title 'main の更新を取り込む' --body-file "$RUNNER_TEMP/upstream-pr.md"
