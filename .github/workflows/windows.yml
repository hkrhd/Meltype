# upstream の build.yml を元に、Windows の検証と Windows・Mac の最新配布物の保存を行う。
name: windows

on:
  push:
    branches: [fork_by_hkrhd]
    paths:
      - 'src/**'
      - 'native/**'
      - 'dictionaries/**'
      - 'tools/**'
      - 'tests/fork/**'
      - 'Meltype.sln'
      - 'Build-Package.ps1'
      - 'Install-Meltype.ps1'
      - 'packaging/**'
      - 'Casks/**'
      - 'docs/**'
      - '.github/workflows/windows.yml'
      - 'mac/fork-version.sh'
  pull_request:
    branches: [fork_by_hkrhd]
    paths:
      - 'src/**'
      - 'native/**'
      - 'dictionaries/**'
      - 'tools/**'
      - 'tests/fork/**'
      - 'Meltype.sln'
      - 'Build-Package.ps1'
      - 'Install-Meltype.ps1'
      - 'packaging/**'
      - 'Casks/**'
      - 'docs/**'
      - '.github/workflows/windows.yml'
      - 'mac/fork-version.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # push の検証更新で、時間のかかる手動の配布物作成を中断しない。
  group: windows-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Meltype.sln -c Release

      # Mozc-UT の辞書の統合 (native/mozc/merge-ut-dictionary.py)。本物の Mozc も辞書も要らない。
      # 環境変数 MELTYPE_UT_DICTIONARY を指定したときだけ使うものなので、ビルドには影響しない。
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Test Mozc-UT dictionary merge
        run: python native/mozc/tests/test_merge_ut_dictionary.py

      # Meltype IME (入力欄に直接入力する TSF の DLL)。C++ なので dotnet build とは別にビルドする (x64 と x86)。
      - name: Build Meltype IME
        shell: pwsh
        run: ./native/tip/build.ps1 -Configuration Release

      - name: Test package scan failure handling
        shell: powershell
        run: .\tools\Test-WindowsPackageScan.ps1

      # Microsoft IME (日本語) や英語のスペルチェッカーが無い環境では、それらを使うテストは飛ばされる。
      - name: Test
        run: dotnet run --project src/Meltype.Tests/Meltype.Tests.csproj -c Release --no-build

  # インストーラーの台本 (packaging/Meltype.iss) が Inno Setup で通るか。中身はダミーのファイルで確かめる (本物は package で作る)。
  installer-script:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Test setup IME registration launcher
        shell: powershell
        run: .\tools\Test-SetupIme.ps1
      - name: Compile installer script
        shell: pwsh
        run: |
          $iscc = .\packaging\Find-InnoSetup.ps1
          $stage = Join-Path $env:RUNNER_TEMP 'Meltype'
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'app') | Out-Null
          Set-Content -LiteralPath (Join-Path $stage 'app\Meltype.exe') -Value 'dummy'
          Copy-Item -LiteralPath LICENSE -Destination (Join-Path $stage 'LICENSE.txt')
          Copy-Item -LiteralPath THIRD-PARTY-NOTICES.md -Destination (Join-Path $stage 'THIRD-PARTY-NOTICES.txt')
          & $iscc /Q "/DAppVersion=0.0.0-check" "/DSourceDir=$stage" "/DOutputDir=$env:RUNNER_TEMP" packaging\Meltype.iss
          if ($LASTEXITCODE -ne 0) { throw "インストーラーの台本を Inno Setup で通せませんでした (exit code $LASTEXITCODE)。" }
          # IME を同梱する場合のチェックボックス・起動処理もコンパイルする。
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'app\tip') | Out-Null
          Set-Content -LiteralPath (Join-Path $stage 'app\meltype-ime.ps1') -Value '# dummy'
          Set-Content -LiteralPath (Join-Path $stage 'app\tip\Register-Tip.ps1') -Value '# dummy'
          & $iscc /Q "/DAppVersion=0.0.0-check-ime" "/DSourceDir=$stage" "/DOutputDir=$env:RUNNER_TEMP" packaging\Meltype.iss
          if ($LASTEXITCODE -ne 0) { throw "IME 同梱のインストーラーを Inno Setup で通せませんでした (exit code $LASTEXITCODE)。" }

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fork_by_hkrhd'
    needs: [test, installer-script]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      build-number: ${{ steps.release.outputs.build-number }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git fetch --no-tags https://github.com/yksr-melt/Meltype.git 'refs/tags/v*:refs/tags/v*'
          version="$(bash mac/fork-version.sh)"
          tag="hkrhd-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            echo "version=$version"
            echo "build-number=$(git rev-list --count HEAD)"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/release.md" <<EOF
          Windows・Mac 向けの個人フォーク検証版です。

          - 版: $version
          - ソース: https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA
          - 検証: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Windows: テスト・パッケージ自己診断・Defender 検査を実行済み。
          - Mac: Apple Silicon / macOS 13.3 以降。Core・Swift テストと実エンジンの入力検証を実行済み。
          - Mac は ZIP を展開し、Install Meltype.command を実行してください。
          - 未署名の場合、OS の警告が出ることがあります。
          - 更新はこの Releases から手動で行ってください。
          EOF
          gh release create "$tag" --target "$GITHUB_SHA" --title "Meltype $version" --notes-file "$RUNNER_TEMP/release.md" --draft --prerelease

  # 同じ VM で Mozc と配布物を作り、Actions の成果物保存を使わない。
  package:
    needs: release
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      MELTYPE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Bazelisk
        shell: pwsh
        run: |
          # 版を固定し、ダウンロードしたものが公開されているものと同じか (SHA-256) を確かめる。
          $version = 'v1.29.0'
          $expected = '092a8738d5b41aae7a85c42cc961b1034e3389aba43ffc20c0fabda7b43e095b'
          New-Item -ItemType Directory -Force -Path C:\tools | Out-Null
          Invoke-WebRequest -Uri "https://github.com/bazelbuild/bazelisk/releases/download/$version/bazelisk-windows-amd64.exe" -OutFile C:\tools\bazelisk.exe
          $actual = (Get-FileHash C:\tools\bazelisk.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Bazelisk のハッシュが違います: $actual" }
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            C:\bazel-cache
            C:\mozc\src\third_party_cache
          key: mozc-${{ hashFiles('native/mozc/MOZC_COMMIT') }}-${{ hashFiles('native/mozc/*.cc', 'native/mozc/BUILD.fragment') }}
          restore-keys: |
            mozc-${{ hashFiles('native/mozc/MOZC_COMMIT') }}-
      - name: Build Mozc helper
        shell: powershell
        run: .\native\mozc\Build-MozcHelper.ps1 -MozcSource C:\mozc -Python python -Bazelisk C:\tools\bazelisk.exe -DiskCache C:\bazel-cache
      # 署名の秘密は、署名する step (Sign / Sign installer) にだけ渡す。ビルドしたもの (Meltype.exe --selftest と、
      # それが起動する Mozc のヘルパー) は、秘密の無い step (Package / Installer / Portable) でだけ実行する。
      - name: Package
        shell: powershell
        # 通常版の app を作って自己診断する。zip は次の Sign で作る。
        run: .\Build-Package.ps1 -Version $env:MELTYPE_VERSION -Step Build
      # コード署名の証明書 (秘密 SIGN_PFX_BASE64 = .pfx を Base64 にしたもの、SIGN_PASSWORD) があれば、Build-Package.ps1 が署名する。
      # 秘密が無いときは署名せずに zip だけ作る。.pfx は署名したらすぐ消す。
      # ZIP とインストーラーをフォーク版番号でそろえる。
      - name: Sign
        shell: powershell
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          MELTYPE_SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
        run: |
          $version = $env:MELTYPE_VERSION
          $pfx = Join-Path $env:RUNNER_TEMP 'meltype-sign.pfx'
          try {
            if ($env:SIGN_PFX_BASE64) {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
              $env:MELTYPE_SIGN_PFX = $pfx
            }
            .\Build-Package.ps1 -Version $version -Step Sign
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
      # インストーラー (dist\Meltype-<版>-setup.exe)。zip と同じ app フォルダーから作る (issue #161)。
      - name: Installer
        shell: pwsh
        run: |
          $iscc = .\packaging\Find-InnoSetup.ps1
          $version = $env:MELTYPE_VERSION
          & $iscc /Q "/DAppVersion=$version" "/DSourceDir=$PWD\dist\Meltype" "/DOutputDir=$PWD\dist" packaging\Meltype.iss
          if ($LASTEXITCODE -ne 0) { throw "インストーラーを作れませんでした (exit code $LASTEXITCODE)。" }
      - name: Sign installer
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          MELTYPE_SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
        run: |
          if (-not $env:SIGN_PFX_BASE64) { exit 0 }
          $setup = Get-ChildItem -LiteralPath dist -Filter 'Meltype-*-setup.exe' -File | Select-Object -First 1
          $pfx = Join-Path $env:RUNNER_TEMP 'meltype-sign.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like '*\x64\*' } | Sort-Object FullName | Select-Object -Last 1
            & $signtool.FullName sign /f $pfx /p $env:MELTYPE_SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setup.FullName
            if ($LASTEXITCODE -ne 0) { throw "インストーラーの署名に失敗しました (exit code $LASTEXITCODE)。" }
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
      # ポータブル版の zip。署名した通常版の app を再利用し、自己診断を走らせる (署名の後の、秘密の無い step で作る)。
      - name: Portable
        shell: powershell
        run: |
          $version = $env:MELTYPE_VERSION
          .\Build-Package.ps1 -Version $version -Portable -ReuseBuild
      # 検出・検査不能の配布物は、Artifacts にもリリースにも公開しない。
      - name: Scan Windows package with Defender
        shell: powershell
        timeout-minutes: 15
        run: |
          $packages = @(Get-ChildItem -LiteralPath dist -Filter 'Meltype-*.zip' -File)
          if ($packages.Count -ne 2) { throw 'Expected regular and portable Meltype zip files but found ' + $packages.Count }
          $setups = @(Get-ChildItem -LiteralPath dist -Filter 'Meltype-*-setup.exe' -File)
          if ($setups.Count -ne 1) { throw 'Expected one Meltype-*-setup.exe file but found ' + $setups.Count }
          .\tools\Scan-WindowsPackage.ps1 -Path @('.\dist\Meltype', '.\dist\Meltype-portable', $packages[0].FullName, $packages[1].FullName, $setups[0].FullName)
      - name: Upload Windows packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Name -like 'Meltype-*.zip' -or $_.Name -like 'Meltype-*-setup.exe' })
          if ($files.Count -ne 3) { throw "配布物が3個そろっていません: $($files.Count)" }
          gh release upload $env:RELEASE_TAG @($files.FullName) --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Windows 配布物をアップロードできませんでした。旧版は保持します。' }

  mac:
    needs: release
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      MELTYPE_VERSION: ${{ needs.release.outputs.version }}
      MELTYPE_BUILD_NUMBER: ${{ needs.release.outputs.build-number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Check build architecture
        run: test "$(uname -m)" = arm64
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: mac/.build
          key: fork-mac-arm64-${{ runner.os }}-${{ hashFiles('mac/Package.swift', 'mac/Package.resolved', 'mac/fetch-zenzai-model.sh', 'mac/build-llama-metal.sh') }}
          restore-keys: fork-mac-arm64-${{ runner.os }}-
      - name: Signing certificate
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_IDENTITY: ${{ secrets.MAC_IDENTITY }}
        run: |
          if [[ -z "$MAC_CERT_P12_BASE64" ]]; then echo "証明書が無いので ad-hoc 署名で配布します"; exit 0; fi
          keychain="$RUNNER_TEMP/meltype.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          keychains=("$keychain")
          while IFS= read -r existing; do
            keychains+=("$(printf '%s' "$existing" | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//')")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          rm "$RUNNER_TEMP/cert.p12"
          echo "MELTYPE_MAC_IDENTITY=$MAC_IDENTITY" >> "$GITHUB_ENV"
      - name: Core and Swift tests and build
        run: bash mac/build-cli.sh --test --build
      - name: Input checks with the real converter
        run: |
          bash tests/fork/mac/check-inputs.sh
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          MELTYPE_DATA_DIR="$temporary" mac/build/Meltype.app/Contents/MacOS/Meltype --check-inputs mac/Resources/InputChecks.tsv
      - name: NativeAOT and Swift boundary tests
        run: |
          python3 tools/test-native-boundaries.py mac/build/Meltype.app/Contents/Frameworks/libMeltypeNative.dylib
          python3 tools/test-mac-boundaries.py mac/build/Meltype.app/Contents/Frameworks/libMeltypeNative.dylib
          python3 tools/test-mac-events.py mac/build/Meltype.app/Contents/Frameworks/libMeltypeNative.dylib
      - name: Notarize
        if: env.MELTYPE_MAC_IDENTITY != ''
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          ditto -c -k --keepParent mac/build/Meltype.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple mac/build/Meltype.app
      - name: Package and upload Mac app
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          bash mac/package.sh "Meltype-$MELTYPE_VERSION-mac.zip"
          gh release upload "$RELEASE_TAG" "dist/Meltype-$MELTYPE_VERSION-mac.zip" --clobber

  publish:
    needs: [release, package, mac]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      MELTYPE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Publish Windows and Mac release
        run: |
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          expected="$(printf '%s\n' "Meltype-$MELTYPE_VERSION-windows.zip" "Meltype-$MELTYPE_VERSION-windows-portable.zip" "Meltype-$MELTYPE_VERSION-setup.exe" "Meltype-$MELTYPE_VERSION-mac.zip" | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Windows・Mac の配布物4個がそろっていません。旧版は保持します。' >&2
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          echo "配布物: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
