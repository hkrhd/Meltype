name: zenzai-update

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: zenzai-update
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'hkrhd/Meltype'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: fork_by_hkrhd
          sparse-checkout: .github/bot
          persist-credentials: false
      - name: Zenzai small の新版を確認し、更新依頼の Draft PR を作成
        run: node .github/bot/zenzai-update.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
